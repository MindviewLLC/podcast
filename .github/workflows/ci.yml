name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 3.11 is the python3 in the maintenance routine's cloud environment (.scripts/README.md)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m compileall -q .scripts .claude/hooks
      - run: python .scripts/verify.py
